# cargo-deny policy for gui_editor, sad2md, sad_xml_sql, and tui_editor (GEDT-AR-00025).
# `build.sh` runs `cargo deny --locked check --deny warnings`,
# so every finding fails the build.
# CI runs the same command for the other crates with `--config ../gui_editor/deny.toml`,
# so this file is the one policy and the one exception list for all four crates.
# Add an exception only as an explicit entry with a reason, never by lowering a level.
# Reference: https://embarkstudios.github.io/cargo-deny/checks/cfg.html

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
unmaintained = "all"
# Each entry needs { id = "RUSTSEC-...", reason = "..." } on one line.
# Mirroring rule: .cargo/audit.toml must list the same IDs,
# each with this reason as a comment, because `cargo audit` reads only that file.
# `check_advisory_ignores.sh` fails the build when the two lists differ.
ignore = []

[licenses]
version = 2
# Applies the license policy to dev-dependencies too,
# so crates used only by tests need an allowed license as well.
include-dev = true
# Licenses compatible with the repository Apache-2.0 license.
# Extend the list only when a new dependency needs another license.
allow = ["Apache-2.0", "MIT"]
confidence-threshold = 0.93
# Keeps the allow list ready for dependencies that T-02 adds.
unused-allowed-license = "allow"

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Each entry needs { crate = "name@version", reason = "..." }.
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
