[package]
name = "sad2md"
version = "0.6.7"
edition = "2021"
license = "Apache-2.0"

[dependencies]
# Default features off drops the wasm-only SQLite backend from the lock file;
# `cache` is the remaining default feature.
rusqlite = { version = "0.41.0", default-features = false, features = ["bundled", "cache"] }
sad_xml_sql = { path = "../sad_xml_sql" }
